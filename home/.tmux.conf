set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g extended-keys on
set -g extended-keys-format csi-u

if-shell '[ "$(cat ~/.cache/theme 2>/dev/null)" = light ]' \
    'source-file ~/.tmux/solarized-light.conf' \
    'source-file ~/.tmux/dark-scheme.conf'
source-file ~/.tmux/keybindings.conf

if-shell '[ -x /usr/bin/fish ]' 'set -g default-shell /usr/bin/fish'
if-shell "[ -f ~/.tmux/local.conf ]" "source-file ~/.tmux/local.conf"

source-file ~/.tmux/plugins.conf
