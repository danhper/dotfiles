unbind C-b
set -g prefix C-j
bind C-j send-prefix

bind -n M-N new-window -c "#{pane_current_path}"
bind -n M-V split-window -h -c "#{pane_current_path}"
bind -n M-S split-window -v -c "#{pane_current_path}"
# extended-keys terminals send alt+shift as M-S-<key> instead of M-<KEY>
bind -n M-S-v split-window -h -c "#{pane_current_path}"
bind -n M-S-s split-window -v -c "#{pane_current_path}"
bind -n M-i next-window
bind -n M-u previous-window
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+Shift+0/1/2/3: focus pane with that tmux index in the current window.
# Index 0 is the left-most (top-left in 2D grids) pane in standard layouts.
# Classic-mode terminals send Alt+Shift+N as ESC + shifted symbol
# (0->')', 1->'!', 2->'@', 3->'#'), decoded as M-) M-! M-@ M-#.
# Extended-key terminals (kitty protocol / modifyOtherKeys) report the same
# chord with an explicit shift modifier; tmux decodes that as M-S-N. Bind
# both spellings. A key whose pane index doesn't exist is a harmless no-op.
bind -n M-) select-pane -t 0
bind -n M-S-0 select-pane -t 0
bind -n M-! select-pane -t 1
bind -n M-S-1 select-pane -t 1
bind -n M-@ select-pane -t 2
bind -n M-S-2 select-pane -t 2
bind -n M-# select-pane -t 3
bind -n M-S-3 select-pane -t 3
bind -n M-$ select-pane -t 4
bind -n M-S-4 select-pane -t 4
