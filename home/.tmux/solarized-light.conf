#### COLOUR (Solarized light)

# default statusbar colors
set-option -g status-style fg=yellow,bg=colour15

# default window title colors
set-window-option -g window-status-style fg=brightyellow,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
set-option -g pane-border-style fg=white #base2
set-option -g pane-active-border-style fg=brightcyan #base1

# message text
set-option -g message-style fg=brightred,bg=white #orange and base2

# pane number display
set-option -g display-panes-active-colour blue #blue
set-option -g display-panes-colour brightred #orange

# clock
set-window-option -g clock-mode-colour green #green

# bell
set-window-option -g window-status-bell-style fg=white,bg=red #base2, red

#### TMUX AGENT SIDEBAR (Solarized light)
# The plugin defaults target dark backgrounds. These use Solarized's dark
# foreground tones so text remains legible against the base3 background.

# Structure and selection
set-option -g @sidebar_color_accent "#268bd2"          # blue
set-option -g @sidebar_color_border "#93a1a1"          # base1
set-option -g @sidebar_color_selection "#eee8d5"       # base2
set-option -g @sidebar_color_session "#268bd2"         # blue

# Primary and secondary text
set-option -g @sidebar_color_text_active "#586e75"     # base01
set-option -g @sidebar_color_text_muted "#839496"      # base0
set-option -g @sidebar_color_text_inactive "#657b83"   # base00
set-option -g @sidebar_color_port "#657b83"            # base00
set-option -g @sidebar_color_wait_reason "#b58900"     # yellow
set-option -g @sidebar_color_response_arrow "#2aa198"  # cyan

# Filters and pane status
set-option -g @sidebar_color_all "#268bd2"             # blue
set-option -g @sidebar_color_running "#859900"         # green
set-option -g @sidebar_color_waiting "#b58900"         # yellow
set-option -g @sidebar_color_idle "#268bd2"            # blue
set-option -g @sidebar_color_error "#dc322f"           # red
set-option -g @sidebar_color_filter_inactive "#93a1a1" # base1

# Agent identity
set-option -g @sidebar_color_agent_claude "#cb4b16"    # orange
set-option -g @sidebar_color_agent_codex "#6c71c4"     # violet
set-option -g @sidebar_color_agent_opencode "#2aa198"  # cyan

# Tasks, activity and Git
set-option -g @sidebar_color_task_progress "#b58900"       # yellow
set-option -g @sidebar_color_subagent "#2aa198"            # cyan
set-option -g @sidebar_color_branch "#2aa198"              # cyan
set-option -g @sidebar_color_commit_hash "#b58900"         # yellow
set-option -g @sidebar_color_diff_added "#859900"          # green
set-option -g @sidebar_color_diff_deleted "#dc322f"        # red
set-option -g @sidebar_color_file_change "#b58900"         # yellow
set-option -g @sidebar_color_pr_link "#268bd2"             # blue
set-option -g @sidebar_color_section_title "#2aa198"       # cyan
set-option -g @sidebar_color_activity_timestamp "#657b83"  # base00
