general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = /home/daniel/.background/amami.jpg
    color = rgb(111111)

    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(ffffff)
    font_size = 72
    font_family = Sans

    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(ffffffcc)
    font_size = 20

    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 3

    inner_color = rgba(111111cc)
    outer_color = rgba(33ccffee)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff4444ee)
    font_color = rgb(ffffff)

    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL</i>
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}
